name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # lib/firebase_options.dart is git-ignored; use the CI placeholder.
      - run: cp tool/ci/firebase_options_stub.dart lib/firebase_options.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Cloud Functions build, lint and emulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # Emulator tests (Functions + security rules) need Java.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm test

  android:
    name: Android builds (real and staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: cp tool/ci/firebase_options_stub.dart lib/firebase_options.dart
      - run: flutter pub get
      # The staging build must install as a separate app from the real one.
      - name: Build both and check their app ids
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          apk=build/app/outputs/flutter-apk/app-debug.apk
          flutter build apk --debug
          test "$($aapt2 dump packagename $apk)" = "com.shopafrik.app"
          flutter build apk --debug --dart-define=KARTAFRIK_ENV=staging
          test "$($aapt2 dump packagename $apk)" = "com.shopafrik.app.staging"
